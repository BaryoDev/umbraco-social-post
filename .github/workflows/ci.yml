name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # scan history, not just the tip

      # The gitleaks binary is MIT licensed and free. Their GitHub Action needs a licence key for
      # an organization. Downloaded and checksummed before it is extracted or run. The digest is
      # from the release's own checksums file and is pinned beside the version.
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSLf -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/BaryoDev.Umbraco.SocialPost.Tests --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/BaryoDev.Umbraco.SocialPost.IntegrationTests --configuration Release --no-build
